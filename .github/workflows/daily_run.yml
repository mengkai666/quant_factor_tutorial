name: 每日主线强度追踪跑批

on:
  schedule:
    # 冗余多次触发, 避免 GitHub 调度器跳过或延迟; 幂等检查保证每天只实际跑一次
    - cron: '30 8 * * 1-5'    # 北京 16:30 (收盘后首次尝试)
    - cron: '30 10 * * 1-5'   # 北京 18:30 (兜底 1)
    - cron: '30 12 * * 1-5'   # 北京 20:30 (兜底 2)
  workflow_dispatch:  # 允许在 GitHub 页面上手动点击 "Run workflow" 运行

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    # 部署到 gh-pages 分支需要写权限
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 检出 gh-pages 历史报告 (若分支已存在)
      uses: actions/checkout@v4
      continue-on-error: true  # 首次运行时 gh-pages 尚不存在, 忽略失败
      with:
        ref: gh-pages
        path: _gh_pages_history

    - name: 幂等检查 (今日报告已存在则跳过, 但化石版必重跑)
      id: idempotency
      run: |
        # 用北京时间(Asia/Shanghai)算"今天", 避免 UTC 日期错位
        TODAY=$(TZ=Asia/Shanghai date +%F)
        echo "today=$TODAY" >> $GITHUB_OUTPUT
        REPORT="_gh_pages_history/reports/${TODAY}.html"
        if [ ! -f "$REPORT" ]; then
          echo "▶ 今日报告尚未生成, 继续跑批"
          echo "skip=false" >> $GITHUB_OUTPUT
        elif grep -q "数据未就位" "$REPORT"; then
          # 凌晨触发时 A股尚未开盘, 腾讯只能拉到上一交易日"化石快照",
          # 护栏正确标"数据未就位". 之后 16:30/18:30/20:30 三次兜底
          # 必须能覆盖它, 否则残缺快照会锁死一整天. (2026-07-27 事故根因)
          echo "▶ 已存在的 ${TODAY}.html 为'数据未就位'化石版, 重跑覆盖"
          echo "skip=false" >> $GITHUB_OUTPUT
        else
          echo "✅ 今日报告已存在且数据完整 (${TODAY}.html), 跳过跑批"
          echo "skip=true" >> $GITHUB_OUTPUT
        fi

    - name: 恢复历史报告到 output/site/ (让首页能扫到全部历史)
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        mkdir -p output/site
        if [ -d _gh_pages_history ]; then
          # 复制历史归档 (reports/ 及既有 index/latest), 排除 git 元数据
          cp -r _gh_pages_history/. output/site/ 2>/dev/null || true
          rm -rf output/site/.git
          echo "已恢复历史报告:"
          ls -1 output/site/reports/ 2>/dev/null | wc -l
        else
          echo "无历史报告 (首次运行)"
        fi

    - name: 设置 Python 3.10
      if: steps.idempotency.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 缓存 pip 依赖
      if: steps.idempotency.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 恢复数据缓存 (CSV)
      if: steps.idempotency.outputs.skip != 'true'
      uses: actions/cache@v4
      id: data-cache
      with:
        path: |
          data/price_history_cache.csv
          data/industry_cache.csv
        key: market-data-cache-${{ github.run_number }}
        restore-keys: |
          market-data-cache-

    - name: 安装 Python 依赖
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装 CJK 字体 (词云用)
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        sudo apt-get update -qq > /dev/null 2>&1
        sudo apt-get install -y -qq fonts-wqy-zenhei > /dev/null 2>&1

    - name: 执行主线强度追踪脚本 (并发送邮件)
      if: steps.idempotency.outputs.skip != 'true'
      env:
        # 从 GitHub Secrets 动态读取邮箱配置，避免密码硬编码泄露
        EMAIL_ENABLE: "1"
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        # AI 反弹研判 (Claude API): 未配 secret 时脚本自动回落规则模板, 不会报错
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 第三方中转地址 (留空则用官方 api.anthropic.com)
        ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      run: |
        python src/主线强度追踪.py

    - name: 数据完整性体检 (只告警, 不阻断发布)
      if: steps.idempotency.outputs.skip != 'true'
      # 跑批后体检, 覆盖"今天刚写进去的数据"而不只是恢复出来的旧缓存。
      # --recent 30: CI 的价格缓存来自 actions/cache, 更早的历史可能根本没恢复进来,
      #   全量体检会把"CI 侧没有的历史"误报成缺陷 (本地全量目前也仍有 40 天已知缺口)。
      # continue-on-error: 体检失败只留 annotation, 不能让报告停发 —— 数据残缺时
      #   主程序自身的"数据未就位"护栏已经会标记报告, 这里是第二道观测, 不是闸门。
      continue-on-error: true
      run: |
        python tools/audit_data_integrity.py --quiet --recent 30

    - name: 提交并推送更新的缓存数据
      if: steps.idempotency.outputs.skip != 'true'
      # 只提交小体积的种子缓存 (涨停历史、板块、情绪)
      # 大文件 (price_history_cache, industry_cache) 由 actions/cache 管理
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # 只 add 小体积缓存文件 (data/ 下), 不 add 大体积 CSV 和 HTML
        git add data/涨停历史缓存.csv data/cls_plate_cache.csv data/sentiment_history_cache.csv 2>/dev/null || true
        # 如果文件有变更，则自动 Commit 和 Push
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data caches [skip ci]" && git push)

    - name: 部署报告站点到 GitHub Pages
      if: steps.idempotency.outputs.skip != 'true'
      # 把 output/site/ (当日报告 + 历史归档 + 首页) 推到 gh-pages 分支
      # 首页地址: https://<用户名>.github.io/<仓库名>/
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output/site
        publish_branch: gh-pages
        # 历史报告已在跑批前恢复进 output/site/, 这里全量发布即可
        # (force_orphan 保持 gh-pages 干净, 只留站点内容不留历史 commit)
        force_orphan: true
        commit_message: "Deploy report site [skip ci]"
