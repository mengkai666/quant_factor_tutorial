name: 每日主线强度追踪跑批

on:
  push:
    branches:
      - master
  schedule:
    # 冗余多次触发, 避免 GitHub 调度器跳过或延迟; 幂等检查保证每天只实际跑一次
    - cron: '30 8 * * 1-5'    # 北京 16:30 (收盘后首次尝试)
    - cron: '30 10 * * 1-5'   # 北京 18:30 (兜底 1)
    - cron: '30 12 * * 1-5'   # 北京 20:30 (兜底 2)
  workflow_dispatch:  # 允许在 GitHub 页面上手动点击 "Run workflow" 运行
    inputs:
      force:
        description: '忽略幂等检查, 强制重跑并覆盖今日报告 (改完代码/修完数据后验证用)'
        type: boolean
        default: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    # 部署到 gh-pages 分支需要写权限
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 检出 gh-pages 历史报告 (若分支已存在)
      uses: actions/checkout@v4
      continue-on-error: true  # 首次运行时 gh-pages 尚不存在, 忽略失败
      with:
        ref: gh-pages
        path: _gh_pages_history

    - name: 幂等检查 (今日报告已存在则跳过, 但化石版必重跑)
      id: idempotency
      run: |
        # 用北京时间(Asia/Shanghai)算"今天", 避免 UTC 日期错位
        TODAY=$(TZ=Asia/Shanghai date +%F)
        echo "today=$TODAY" >> $GITHUB_OUTPUT
        REPORT="_gh_pages_history/reports/${TODAY}.html"
        if [ "${{ inputs.force }}" = "true" ]; then
          # 幂等检查会让"修完代码/数据后想验一遍"变成不可能: 今日报告一存在,
          # 整个 workflow 就只剩空转, 绿灯什么也不证明。手动 force 是唯一出口,
          # 代价是覆盖今日已发布的报告 —— 而那正是重跑的目的。
          echo "▶ 手动 force: 忽略幂等检查, 强制重跑并覆盖 ${TODAY} 的报告"
          echo "skip=false" >> $GITHUB_OUTPUT
        elif [ ! -f "$REPORT" ]; then
          echo "▶ 今日报告尚未生成, 继续跑批"
          echo "skip=false" >> $GITHUB_OUTPUT
        elif grep -q "阶段数据滞后" "$REPORT"; then
          # 阶段共振层的数据源 (akshare 指数日线) 收盘后要过一阵才更新当天 K 线。
          # 16:30 那班经常拿不到, 于是整层用前一交易日收尾, 报告却盖今天的章 ——
          # 同一天两份报告的"主升段收益"能一条 +0.86 一条 -0.16 (2026-09-01 实测)。
          # 已存在的报告自报滞后, 就让后面的兜底 cron 重跑覆盖它。
          echo "▶ 已存在的 ${TODAY}.html 阶段数据滞后 (指数日线未含当日), 重跑覆盖"
          echo "skip=false" >> $GITHUB_OUTPUT
        elif grep -q "数据未就位" "$REPORT"; then
          # 凌晨触发时 A股尚未开盘, 腾讯只能拉到上一交易日"化石快照",
          # 护栏正确标"数据未就位". 之后 16:30/18:30/20:30 三次兜底
          # 必须能覆盖它, 否则残缺快照会锁死一整天. (2026-07-27 事故根因)
          echo "▶ 已存在的 ${TODAY}.html 为'数据未就位'化石版, 重跑覆盖"
          echo "skip=false" >> $GITHUB_OUTPUT
        else
          echo "✅ 今日报告已存在且数据完整 (${TODAY}.html), 跳过跑批"
          echo "skip=true" >> $GITHUB_OUTPUT
        fi

    - name: 恢复历史报告到 output/site/ (让首页能扫到全部历史)
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        mkdir -p output/site
        if [ -d _gh_pages_history ]; then
          # 复制历史归档 (reports/ 及既有 index/latest), 排除 git 元数据
          cp -r _gh_pages_history/. output/site/ 2>/dev/null || true
          rm -rf output/site/.git
          echo "已恢复历史报告:"
          ls -1 output/site/reports/ 2>/dev/null | wc -l
        else
          echo "无历史报告 (首次运行)"
        fi

    - name: 设置 Python 3.10
      if: steps.idempotency.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 缓存 pip 依赖
      if: steps.idempotency.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 恢复数据缓存 (仅 .gitignore 里的大文件)
      if: steps.idempotency.outputs.skip != 'true'
      uses: actions/cache@v4
      id: data-cache
      with:
        # 这里**只能放不进 git 的文件**。actions/cache 是在 checkout 之后解包的,
        # 会直接盖掉工作区里同路径的文件 —— 于是任何"既进 git 又进 cache"的文件都
        # 有一条静默的数据回退通道: git 里是两侧的并集, cache 里只有 CI 自己那份,
        # 解包后本地跑批攒的记录当场消失, 紧接着下面的 `git add` 又把这个"消失"
        # 提交回 master。report_prediction_history.jsonl / market_phase_snapshots.jsonl
        # / report_daily_snapshots 就曾经这样每天丢本地记录 (它们是不可重算的留痕,
        # 且 build_scenario_calibration 的样本按桶算, 丢行=掉校准), 已从这里移出,
        # 一律以 git 为准。
        path: |
          data/price_history_cache.csv
          data/industry_cache.csv
          data/stock_universe.csv
          data/fetch_status.csv
          data/trading_calendar_cache.csv
          data/price_gap_negative_cache.csv
        key: market-data-cache-${{ github.run_number }}
        restore-keys: |
          market-data-cache-

    - name: 安装 Python 依赖
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装 CJK 字体 (词云用)
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        sudo apt-get update -qq > /dev/null 2>&1
        sudo apt-get install -y -qq fonts-wqy-zenhei > /dev/null 2>&1

    - name: 刷新证券主表 (universe only, 不抓价格)
      if: steps.idempotency.outputs.skip != 'true'
      # rebuild_market_data 全量抓价格走 akshare/sina 逐股接口, GitHub Actions 上
      # stock.finance.sina.com.cn 被封 → coverage < 90% → DataQualityError → CI 挂。
      # 价格增量由下一步"主线强度追踪脚本"用腾讯批量快照接口（qt.gtimg.cn）完成；
      # 这里只刷新证券主表（不依赖被封域名）以保证 universe 是最新的。
      continue-on-error: true   # universe 刷新失败不阻断报告（主脚本有缓存兜底）
      run: |
        python -c "
        import sys; sys.path.insert(0,'src')
        from data_sources.universe_provider import UniverseProvider
        from data_sources.fetch_status import FetchStatusStore
        from paths import UNIVERSE_CACHE, FETCH_STATUS_CACHE
        u = UniverseProvider(status_store=FetchStatusStore(FETCH_STATUS_CACHE))
        df = u.refresh(UNIVERSE_CACHE)
        print(f'universe refreshed: {len(df)} stocks')
        " 2>&1

    - name: 核心数据质量闸门 (只审已有缓存, 不阻断新增日期缺口)
      if: steps.idempotency.outputs.skip != 'true'
      # audit_data_integrity 只读本地缓存, 无网络依赖, 安全运行
      # --recent 10 只看最近10个交易日, 避免历史积压缺口误报
      continue-on-error: true   # 质量问题记录但不阻断跑批, 报告里会标注数据状态
      run: |
        python tools/audit_data_integrity.py --quiet --recent 10 2>&1 || true

    - name: 执行主线强度追踪脚本 (并发送邮件)
      if: steps.idempotency.outputs.skip != 'true'
      env:
        # 从 GitHub Secrets 动态读取邮箱配置，避免密码硬编码泄露
        REPORT_DATE: ${{ steps.idempotency.outputs.today }}
        EMAIL_ENABLE: "1"
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        # AI 反弹研判 (Claude API): 未配 secret 时脚本自动回落规则模板, 不会报错
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 第三方中转地址 (留空则用官方 api.anthropic.com)
        ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        # 主模型连续失败后的可选备用模型；未配置时不额外请求
        ANTHROPIC_FALLBACK_MODEL: ${{ secrets.ANTHROPIC_FALLBACK_MODEL }}
      run: |
        python src/主线强度追踪.py

    - name: 自动回填成熟的 T+1 / T+3 结果
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        python tools/reconcile_prediction_outcomes.py

    - name: 提交并推送更新的缓存数据
      if: steps.idempotency.outputs.skip != 'true'
      # 只提交小体积的种子缓存 (涨停历史、板块、情绪)
      # 大文件 (price_history_cache, industry_cache) 由 actions/cache 管理
      run: |
        set -euo pipefail
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # 只 add 小体积缓存文件 (data/ 下), 不 add 大体积 CSV 和 HTML
        git add data/涨停历史缓存.csv data/cls_plate_cache.csv data/sentiment_history_cache.csv data/ths_sector_hist.json 2>/dev/null || true
        git add data/report_prediction_history.jsonl data/market_phase_snapshots.jsonl 2>/dev/null || true
        # 快照目录同样用 -A: cache_budget 会按保留窗口删最老的 json, 而 shell glob
        # 展开不到已删除的文件 —— 用 glob 的话那些删除永远推不上去, 瘦身对仓库无效。
        git add -A data/report_daily_snapshots 2>/dev/null || true
        # 价格缓存的逐日 gzip 切片 (一天 ≈ 90KB): 大 CSV 在 .gitignore 里, 本地和 CI
        # 各存一份且从不对账 —— 切片是这份数据在仓库里唯一可回溯的副本, 也是两侧
        # 互补空洞的通道 (2026-08-28: CI 有数据、本地整天是空的, 谁也看不出来)。
        # 用 -A 而不是 glob: 切片有保留上限 (KEEP_SLICES, 超了删最老的), shell glob
        # 展开不到已删除的文件, 那些删除就永远推不上去。
        git add -A data/price_slices 2>/dev/null || true
        # 空暂存区是正常情况，不能让后续 Pages 部署被跳过。
        if git diff --staged --quiet; then
          echo "缓存无变化，跳过提交"
        else
          git commit -m "Auto-update market data caches [skip ci]"
          git push
        fi

    - name: 校验实际报告站点产物
      id: report_validation
      if: steps.idempotency.outputs.skip != 'true'
      run: |
        set -euo pipefail
        RUN_DATE="${{ steps.idempotency.outputs.today }}"
        OUTPUT_HTML="output/主线强度追踪.html"
        REPORT_DIR="output/site/reports"
        test -s "$OUTPUT_HTML"
        test -d "$REPORT_DIR"

        # 报告内声明的业务日期是归档唯一真源；禁止按运行自然日或扫描结果猜日期。
        REPORT_DATE="$(python - <<'PY'
        import sys
        sys.path.insert(0, "src")
        from publish_site import extract_report_date
        from report_integrity import validate_rendered_report

        validate_rendered_report("output/主线强度追踪.html")
        report_date = extract_report_date("output/主线强度追踪.html")
        if not report_date:
            raise SystemExit("报告缺少有效 report-date 元数据")
        print(report_date)
        PY
        )"
        if [[ "$REPORT_DATE" > "$RUN_DATE" ]]; then
          echo "报告日期 $REPORT_DATE 晚于运行日期 $RUN_DATE" >&2
          exit 1
        fi

        echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
        if [[ "$REPORT_DATE" < "$RUN_DATE" ]]; then
          STALE_DAYS=$(( ( $(date -d "$RUN_DATE" +%s) - $(date -d "$REPORT_DATE" +%s) ) / 86400 ))
          echo "stale_days=$STALE_DAYS" >> "$GITHUB_OUTPUT"
          echo "⚠️ 运行日期：$RUN_DATE"
          echo "⚠️ 实际报告日期：$REPORT_DATE"
          echo "⚠️ 数据滞后：$STALE_DAYS 个自然日；保留真实交易日口径，不伪造日期"
        else
          echo "stale_days=0" >> "$GITHUB_OUTPUT"
          echo "✅ 实际报告日期：$REPORT_DATE"
        fi

        test -s "$REPORT_DIR/$REPORT_DATE.html"
        test -s output/site/latest.html
        test -s output/site/index.html
        ARCHIVE_DATE="$(python - "$REPORT_DIR/$REPORT_DATE.html" <<'PY'
        import sys
        sys.path.insert(0, "src")
        from publish_site import extract_report_date
        from report_integrity import validate_rendered_report

        validate_rendered_report(sys.argv[1])
        report_date = extract_report_date(sys.argv[1])
        if not report_date:
            raise SystemExit("日期归档缺少有效 report-date 元数据")
        print(report_date)
        PY
        )"
        if [ "$ARCHIVE_DATE" != "$REPORT_DATE" ]; then
          echo "归档文件名日期 $REPORT_DATE 与正文日期 $ARCHIVE_DATE 不一致" >&2
          exit 1
        fi
        cmp --silent "$OUTPUT_HTML" "$REPORT_DIR/$REPORT_DATE.html"
        cmp --silent "$OUTPUT_HTML" output/site/latest.html
        grep -q "reports/$REPORT_DATE.html" output/site/index.html

    - name: 部署报告站点到 GitHub Pages
      if: steps.idempotency.outputs.skip != 'true'
      # 把 output/site/ (当日报告 + 历史归档 + 首页) 推到 gh-pages 分支
      # 首页地址: https://<用户名>.github.io/<仓库名>/
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output/site
        publish_branch: gh-pages
        # 历史报告已在跑批前恢复进 output/site/, 这里全量发布即可
        # (force_orphan 保持 gh-pages 干净, 只留站点内容不留历史 commit)
        force_orphan: true
        commit_message: "Deploy report site [skip ci]"

    - name: 收尾自检 (数据完整性, 有空洞则染红本次跑批)
      if: steps.idempotency.outputs.skip != 'true'
      # 刻意放在部署之后: 体检失败只染红跑批, 不许拦住当天报告发布
      # (报告自身有 report-integrity 门禁负责降级披露)。
      # 与开头那道"核心数据质量闸门"的区别: 开头是 continue-on-error 的预检,
      # 这里是唯一会让 workflow 变红的一道 —— 空洞必须有人看见, 不能过夜。
      # 走 src/data_selfcheck.py 而不是直接调 audit: 窗口要按证券口径台阶自适应,
      # 本地跑批和 CI 共用同一套策略 (写死天数会在下次口径扩容后天天误报)。
      run: |
        python src/data_selfcheck.py
